<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>線上檔案轉換器 - 支援 PPT/DOC 轉 PDF</title>
    <meta name="description" content="免費線上檔案轉換工具，支援 PowerPoint、Word 轉 PDF，純前端處理，資料不上傳">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .converter-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            padding: 40px;
            max-width: 600px;
            width: 100%;
            text-align: center;
        }
        
        .logo {
            font-size: 48px;
            margin-bottom: 10px;
        }
        
        h1 {
            color: #2c3e50;
            font-size: 28px;
            margin-bottom: 10px;
            font-weight: 600;
        }
        
        .subtitle {
            color: #7f8c8d;
            font-size: 16px;
            margin-bottom: 40px;
        }
        
        .upload-area {
            border: 2px dashed #bdc3c7;
            border-radius: 15px;
            padding: 40px 20px;
            margin: 30px 0;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f8f9fa;
        }
        
        .upload-area:hover {
            border-color: #3498db;
            background: #ebf3fd;
            transform: translateY(-2px);
        }
        
        .upload-area.dragover {
            border-color: #2ecc71;
            background: #eafaf1;
        }
        
        .upload-icon {
            font-size: 64px;
            color: #bdc3c7;
            margin-bottom: 20px;
            display: block;
        }
        
        .upload-text {
            font-size: 18px;
            color: #2c3e50;
            margin-bottom: 10px;
            font-weight: 500;
        }
        
        .upload-hint {
            color: #7f8c8d;
            font-size: 14px;
        }
        
        .file-input {
            display: none;
        }
        
        .convert-btn {
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 20px 0;
            display: none;
        }
        
        .convert-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(52, 152, 219, 0.3);
        }
        
        .convert-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .progress-container {
            display: none;
            margin: 30px 0;
        }
        
        .progress-bar {
            width: 100%;
            height: 8px;
            background: #ecf0f1;
            border-radius: 4px;
            overflow: hidden;
            margin: 10px 0;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #3498db, #2ecc71);
            width: 0%;
            transition: width 0.3s ease;
        }
        
        .status-message {
            color: #2c3e50;
            font-size: 16px;
            margin: 10px 0;
        }
        
        .selected-file {
            background: #e8f5e8;
            border: 1px solid #2ecc71;
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
            display: none;
        }
        
        .file-icon {
            font-size: 32px;
            margin-bottom: 10px;
        }
        
        .file-name {
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 5px;
        }
        
        .file-size {
            color: #7f8c8d;
            font-size: 14px;
        }
        
        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin: 40px 0;
        }
        
        .feature {
            text-align: center;
            padding: 20px;
        }
        
        .feature-icon {
            font-size: 32px;
            margin-bottom: 10px;
            display: block;
        }
        
        .feature-text {
            color: #2c3e50;
            font-size: 14px;
            font-weight: 500;
        }
        
        .github-link {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 10px 15px;
            border-radius: 25px;
            text-decoration: none;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        
        .github-link:hover {
            background: rgba(0,0,0,0.9);
            transform: translateY(-2px);
        }
        
        @media (max-width: 768px) {
            .converter-container {
                padding: 30px 20px;
                margin: 10px;
            }
            
            h1 {
                font-size: 24px;
            }
            
            .upload-area {
                padding: 30px 15px;
            }
            
            .features {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <a href="https://github.com/your-username/file-converter" class="github-link" target="_blank">
        ⭐ GitHub
    </a>
    
    <div class="converter-container">
        <div class="logo">📄</div>
        <h1>線上檔案轉換器</h1>
        <p class="subtitle">免費將 PowerPoint、Word 轉換為 PDF</p>
        
        <div class="upload-area" onclick="document.getElementById('fileInput').click()">
            <span class="upload-icon">📁</span>
            <div class="upload-text">點擊選擇檔案或拖拽到此處</div>
            <div class="upload-hint">支援 .pptx, .ppt, .docx, .doc 格式</div>
        </div>
        
        <input type="file" id="fileInput" class="file-input" accept=".pptx,.ppt,.docx,.doc">
        
        <div id="selectedFile" class="selected-file">
            <div class="file-icon">📄</div>
            <div class="file-name" id="fileName"></div>
            <div class="file-size" id="fileSize"></div>
        </div>
        
        <button id="convertBtn" class="convert-btn">
            🔄 開始轉換
        </button>
        
        <div id="progressContainer" class="progress-container">
            <div class="status-message" id="statusMessage">準備轉換...</div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>
        
        <div class="features">
            <div class="feature">
                <span class="feature-icon">🔒</span>
                <div class="feature-text">完全私密<br>檔案不上傳</div>
            </div>
            <div class="feature">
                <span class="feature-icon">⚡</span>
                <div class="feature-text">快速轉換<br>純瀏覽器處理</div>
            </div>
            <div class="feature">
                <span class="feature-icon">💎</span>
                <div class="feature-text">高品質<br>保留原始格式</div>
            </div>
        </div>
    </div>
    
    <!-- 載入轉換引擎 -->
    <script>
        let selectedFile = null;
        let isConverting = false;
        
        // DOM 元素
        const fileInput = document.getElementById('fileInput');
        const uploadArea = document.querySelector('.upload-area');
        const selectedFileDiv = document.getElementById('selectedFile');
        const convertBtn = document.getElementById('convertBtn');
        const progressContainer = document.getElementById('progressContainer');
        const statusMessage = document.getElementById('statusMessage');
        const progressFill = document.getElementById('progressFill');
        
        // 檔案選擇處理
        fileInput.addEventListener('change', handleFileSelect);
        convertBtn.addEventListener('click', convertFile);
        
        // 拖拽功能
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });
        
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        });
        
        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file) {
                handleFile(file);
            }
        }
        
        function handleFile(file) {
            const validTypes = ['.pptx', '.ppt', '.docx', '.doc'];
            const fileExtension = '.' + file.name.split('.').pop().toLowerCase();
            
            if (!validTypes.includes(fileExtension)) {
                alert('請選擇支援的檔案格式：.pptx, .ppt, .docx, .doc');
                return;
            }
            
            selectedFile = file;
            
            // 顯示選中的檔案
            document.getElementById('fileName').textContent = file.name;
            document.getElementById('fileSize').textContent = formatFileSize(file.size);
            selectedFileDiv.style.display = 'block';
            convertBtn.style.display = 'inline-block';
            
            // 更新上傳區域
            uploadArea.innerHTML = `
                <span class="upload-icon">✅</span>
                <div class="upload-text">檔案已選擇</div>
                <div class="upload-hint">點擊重新選擇其他檔案</div>
            `;
        }
        
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }
        
        async function convertFile() {
            if (!selectedFile || isConverting) return;
            
            isConverting = true;
            convertBtn.disabled = true;
            progressContainer.style.display = 'block';
            
            try {
                updateProgress(10, '正在載入轉換引擎...');
                
                // 檢查檔案類型
                const fileType = selectedFile.name.toLowerCase().split('.').pop();
                
                updateProgress(30, '正在處理檔案...');
                
                // 這裡是關鍵：實際的轉換邏輯
                let pdfBlob;
                
                if (fileType === 'pptx' || fileType === 'ppt') {
                    pdfBlob = await convertPresentationToPDF(selectedFile);
                } else if (fileType === 'docx' || fileType === 'doc') {
                    pdfBlob = await convertDocumentToPDF(selectedFile);
                }
                
                updateProgress(90, '正在生成 PDF...');
                
                // 下載檔案
                const downloadUrl = URL.createObjectURL(pdfBlob);
                const downloadLink = document.createElement('a');
                downloadLink.href = downloadUrl;
                downloadLink.download = selectedFile.name.replace(/\.[^.]+$/, '.pdf');
                downloadLink.click();
                
                updateProgress(100, '✅ 轉換完成！');
                
                setTimeout(() => {
                    resetConverter();
                }, 3000);
                
            } catch (error) {
                console.error('轉換失敗:', error);
                statusMessage.textContent = `❌ 轉換失敗: ${error.message}`;
                statusMessage.style.color = '#e74c3c';
                
                setTimeout(() => {
                    resetConverter();
                }, 3000);
            }
        }
        
        // 載入必需的庫
        async function loadLibraries() {
            if (!window.mammoth) {
                const mammothScript = document.createElement('script');
                mammothScript.src = 'https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js';
                document.head.appendChild(mammothScript);
                await new Promise(resolve => mammothScript.onload = resolve);
            }
            
            if (!window.JSZip) {
                const jszipScript = document.createElement('script');
                jszipScript.src = 'https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js';
                document.head.appendChild(jszipScript);
                await new Promise(resolve => jszipScript.onload = resolve);
            }
            
            if (!window.jsPDF) {
                const jspdfScript = document.createElement('script');
                jspdfScript.src = 'https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js';
                document.head.appendChild(jspdfScript);
                await new Promise(resolve => jspdfScript.onload = resolve);
            }
            
            if (!window.html2canvas) {
                const html2canvasScript = document.createElement('script');
                html2canvasScript.src = 'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';
                document.head.appendChild(html2canvasScript);
                await new Promise(resolve => html2canvasScript.onload = resolve);
            }
        }
        
        // 實際轉換函數
        async function convertPresentationToPDF(file) {
            updateProgress(20, '載入轉換庫...');
            await loadLibraries();
            
            updateProgress(40, '解析簡報文件...');
            
            try {
                const zip = await JSZip.loadAsync(file);
                const slideFiles = Object.keys(zip.files).filter(name => 
                    name.startsWith('ppt/slides/slide') && name.endsWith('.xml')
                );
                
                updateProgress(60, '提取簡報內容...');
                
                const slides = [];
                for (const slideFile of slideFiles) {
                    const slideXML = await zip.files[slideFile].async('string');
                    const slideContent = extractSlideText(slideXML);
                    slides.push(slideContent);
                }
                
                updateProgress(80, '生成PDF...');
                return await createPDFFromSlides(slides, file.name);
                
            } catch (error) {
                console.error('PPTX解析錯誤:', error);
                throw new Error('無法解析PPTX檔案');
            }
        }
        
        async function convertDocumentToPDF(file) {
            updateProgress(20, '載入轉換庫...');
            await loadLibraries();
            
            updateProgress(40, '解析Word文件...');
            
            try {
                const arrayBuffer = await file.arrayBuffer();
                const result = await mammoth.convertToHtml({arrayBuffer: arrayBuffer});
                
                updateProgress(60, '轉換為PDF格式...');
                return await createPDFFromHTML(result.value, file.name);
                
            } catch (error) {
                console.error('DOCX解析錯誤:', error);
                throw new Error('無法解析DOCX檔案');
            }
        }
        
        // 提取簡報文字內容
        function extractSlideText(slideXML) {
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(slideXML, 'text/xml');
            
            // 提取所有文字節點
            const textNodes = xmlDoc.querySelectorAll('a\\:t, t');
            const texts = Array.from(textNodes).map(node => node.textContent).filter(text => text.trim());
            
            return texts.join(' ');
        }
        
        // 從簡報建立PDF
        async function createPDFFromSlides(slides, fileName) {
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF();
            
            slides.forEach((slideContent, index) => {
                if (index > 0) {
                    pdf.addPage();
                }
                
                // 標題
                pdf.setFontSize(18);
                pdf.setFont('helvetica', 'bold');
                pdf.text(`投影片 ${index + 1}`, 20, 30);
                
                // 內容
                pdf.setFontSize(12);
                pdf.setFont('helvetica', 'normal');
                
                if (slideContent.trim()) {
                    const lines = pdf.splitTextToSize(slideContent, 170);
                    pdf.text(lines, 20, 50);
                } else {
                    pdf.text('(此投影片無文字內容)', 20, 50);
                }
            });
            
            return pdf.output('blob');
        }
        
        // 從HTML建立PDF
        async function createPDFFromHTML(htmlContent, fileName) {
            // 建立隱藏的容器來渲染HTML
            const container = document.createElement('div');
            container.style.cssText = `
                position: absolute;
                left: -9999px;
                top: 0;
                width: 794px;
                padding: 40px;
                background: white;
                font-family: Arial, sans-serif;
                line-height: 1.6;
            `;
            container.innerHTML = htmlContent;
            document.body.appendChild(container);
            
            try {
                // 使用html2canvas截圖
                const canvas = await html2canvas(container, {
                    scale: 2,
                    useCORS: true,
                    allowTaint: true,
                    backgroundColor: '#ffffff'
                });
                
                // 建立PDF
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF('p', 'mm', 'a4');
                
                const imgWidth = 210; // A4寬度
                const imgHeight = (canvas.height * imgWidth) / canvas.width;
                
                // 計算需要多少頁
                const pageHeight = 297; // A4高度
                let remainingHeight = imgHeight;
                let yPosition = 0;
                
                while (remainingHeight > 0) {
                    const currentPageHeight = Math.min(pageHeight, remainingHeight);
                    
                    // 裁切當前頁面的圖片
                    const pageCanvas = document.createElement('canvas');
                    pageCanvas.width = canvas.width;
                    pageCanvas.height = (currentPageHeight * canvas.width) / imgWidth;
                    
                    const pageCtx = pageCanvas.getContext('2d');
                    pageCtx.drawImage(
                        canvas,
                        0, yPosition * canvas.width / imgWidth,
                        canvas.width, pageCanvas.height,
                        0, 0,
                        canvas.width, pageCanvas.height
                    );
                    
                    if (yPosition > 0) {
                        pdf.addPage();
                    }
                    
                    pdf.addImage(pageCanvas.toDataURL('image/png'), 'PNG', 0, 0, imgWidth, currentPageHeight);
                    
                    yPosition += currentPageHeight;
                    remainingHeight -= currentPageHeight;
                }
                
                return pdf.output('blob');
                
            } finally {
                document.body.removeChild(container);
            }
        }
        
        function updateProgress(percentage, message) {
            progressFill.style.width = percentage + '%';
            statusMessage.textContent = message;
        }
        
        function resetConverter() {
            isConverting = false;
            convertBtn.disabled = false;
            progressContainer.style.display = 'none';
            selectedFileDiv.style.display = 'none';
            convertBtn.style.display = 'none';
            selectedFile = null;
            
            // 重置上傳區域
            uploadArea.innerHTML = `
                <span class="upload-icon">📁</span>
                <div class="upload-text">點擊選擇檔案或拖拽到此處</div>
                <div class="upload-hint">支援 .pptx, .ppt, .docx, .doc 格式</div>
            `;
            
            statusMessage.style.color = '#2c3e50';
            fileInput.value = '';
        }
        
        // 初始化提示
        console.log('🚀 檔案轉換器已載入');
        console.log('📋 當前狀態: 示範模式 - 需要整合實際轉換引擎');
    </script>
</body>
</html>
